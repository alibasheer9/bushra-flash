<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Pro - منصة البطاقات التعليمية</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Styles for 3D Card Flip & Animations -->
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-[#FAF6F0] text-[#121212] font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // البيانات الافتراضية للبدء
    const INITIAL_DECKS = [
      {
        id: 'deck-1',
        title: 'Medical Terminology - OB/GYN',
        description: 'مصطلحات وتعريفات أساسية ومهمة في التوليد والأمراض النسائية',
        cards: [
          { id: 'c1', front: 'Gravida vs Para', back: 'Gravida: عدد مرات الحمل الكلي.\nPara: عدد الأحمال التي وصلت لسن إمكانية الحياة (Viable age).', difficulty: 'easy' },
          { id: 'c2', front: 'Preeclampsia Triad', back: '1. ارتفاع ضغط الدم (Hypertension)\n2. زلال البول (Proteinuria)\n3. التورم (Edema) بعد الأسبوع 20 من الحمل.', difficulty: 'medium' },
          { id: 'c3', front: 'Apgar Score Timing', back: 'يتم تقييمه في الدقيقة الأولى والدقيقة الخامسة بعد ولادة الطفل.', difficulty: 'hard' }
        ]
      },
      {
        id: 'deck-2',
        title: 'General Pharmacology',
        description: 'مراجعة آليات عمل الأدوية والآثار الجانبية',
        cards: [
          { id: 'c4', front: 'ACE Inhibitors Mechanism', back: 'تثبيط إنزيم تحويل الأنجيوتنسين لتخفيض ضغط الدم.', difficulty: 'easy' },
          { id: 'c5', front: 'Beta Blockers Side Effects', back: 'بطء ضربات القلب (Bradycardia)، الإجهاد، تقلص القصبات الهوائية.', difficulty: 'medium' }
        ]
      }
    ];

    function App() {
      // Storage States
      const [decks, setDecks] = useState(() => {
        const saved = localStorage.getItem('flashcards_data');
        return saved ? JSON.parse(saved) : INITIAL_DECKS;
      });

      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('flashcards_stats');
        return saved ? JSON.parse(saved) : { streak: 5, studiedToday: 12, accuracy: 92, totalMastered: 15 };
      });

      // UI States
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedDeck, setSelectedDeck] = useState(null);
      
      // Study Session States
      const [currentCardIdx, setCurrentCardIdx] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionCompleted, setSessionCompleted] = useState(false);

      // Modals
      const [showDeckModal, setShowDeckModal] = useState(false);
      const [deckTitle, setDeckTitle] = useState('');
      const [deckDesc, setDeckDesc] = useState('');

      const [showCardModal, setShowCardModal] = useState(false);
      const [cardFront, setCardFront] = useState('');
      const [cardBack, setCardBack] = useState('');

      // Auto Sync to LocalStorage
      useEffect(() => {
        localStorage.setItem('flashcards_data', JSON.stringify(decks));
      }, [decks]);

      useEffect(() => {
        localStorage.setItem('flashcards_stats', JSON.stringify(stats));
      }, [stats]);

      // Handlers
      const handleCreateDeck = (e) => {
        e.preventDefault();
        if (!deckTitle.trim()) return;
        const newDeck = {
          id: 'deck-' + Date.now(),
          title: deckTitle,
          description: deckDesc,
          cards: []
        };
        setDecks([...decks, newDeck]);
        setDeckTitle('');
        setDeckDesc('');
        setShowDeckModal(false);
      };

      const handleDeleteDeck = (deckId) => {
        if (confirm('هل أنت تأكد من رغبتك في حذف هذه المجموعة؟')) {
          setDecks(decks.filter(d => d.id !== deckId));
          if (selectedDeck && selectedDeck.id === deckId) setSelectedDeck(null);
        }
      };

      const handleAddCard = (e) => {
        e.preventDefault();
        if (!cardFront.trim() || !cardBack.trim() || !selectedDeck) return;

        const newCard = {
          id: 'card-' + Date.now(),
          front: cardFront,
          back: cardBack,
          difficulty: 'medium'
        };

        const updatedDecks = decks.map(d => {
          if (d.id === selectedDeck.id) {
            return { ...d, cards: [...d.cards, newCard] };
          }
          return d;
        });

        setDecks(updatedDecks);
        setSelectedDeck(updatedDecks.find(d => d.id === selectedDeck.id));
        setCardFront('');
        setCardBack('');
        setShowCardModal(false);
      };

      const startStudySession = (deck) => {
        if (!deck.cards || deck.cards.length === 0) {
          alert('هذه المجموعة لا تحتوي على بطاقات بعد. أضف بطاقات أولاً للبدء!');
          return;
        }
        setSelectedDeck(deck);
        setCurrentCardIdx(0);
        setIsFlipped(false);
        setSessionCompleted(false);
        setActiveTab('study');
      };

      const handleRateCard = (rating) => {
        setIsFlipped(false);
        
        setStats(prev => ({
          ...prev,
          studiedToday: prev.studiedToday + 1,
          totalMastered: rating === 'easy' ? prev.totalMastered + 1 : prev.totalMastered
        }));

        setTimeout(() => {
          if (currentCardIdx + 1 < selectedDeck.cards.length) {
            setCurrentCardIdx(prev => prev + 1);
          } else {
            setSessionCompleted(true);
          }
        }, 200);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header Nav */}
          <header className="bg-white border-b border-[#EFE6DD] sticky top-0 z-30 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div 
                onClick={() => { setActiveTab('dashboard'); setSelectedDeck(null); }}
                className="flex items-center gap-3 cursor-pointer"
              >
                <div className="w-10 h-10 rounded-xl bg-[#800020] flex items-center justify-center text-white font-bold text-xl shadow">
                  🎴
                </div>
                <span className="text-xl font-extrabold text-[#800020]">FlashCard Pro</span>
              </div>

              <nav className="flex items-center gap-2">
                <button
                  onClick={() => { setActiveTab('dashboard'); setSelectedDeck(null); }}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                    activeTab === 'dashboard' ? 'bg-[#800020] text-white' : 'text-gray-600 hover:bg-[#EFE6DD]'
                  }`}
                >
                  📊 لوحة التحكم
                </button>
                <button
                  onClick={() => { setActiveTab('decks'); setSelectedDeck(null); }}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition ${
                    activeTab === 'decks' ? 'bg-[#800020] text-white' : 'text-gray-600 hover:bg-[#EFE6DD]'
                  }`}
                >
                  📚 المجموعات ({decks.length})
                </button>
              </nav>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
            
            {/* DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                {/* Hero */}
                <div className="bg-white p-6 sm:p-8 rounded-2xl border border-[#EFE6DD] shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h1 className="text-2xl font-black text-[#121212]">
                      مرحباً بك مجدداً 👋
                    </h1>
                    <p className="text-gray-600 text-sm mt-1">
                      حافظ على استمرارية الدراسة اليومية واختبر معلوماتك بانتظام.
                    </p>
                  </div>
                  <button
                    onClick={() => setActiveTab('decks')}
                    className="px-5 py-2.5 bg-[#800020] hover:bg-[#5A0016] text-white font-bold rounded-xl shadow transition"
                  >
                    🚀 ابدأ الدراسة الآن
                  </button>
                </div>

                {/* Stats */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="p-5 rounded-2xl bg-[#800020] text-white shadow-sm">
                    <div className="text-xs font-bold opacity-80">سلسلة الأيام (Streak)</div>
                    <div className="text-2xl font-black mt-2">🔥 {stats.streak} أيام</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-white border border-[#EFE6DD]">
                    <div className="text-xs font-bold text-gray-500">تمت دراستها اليوم</div>
                    <div className="text-2xl font-black text-[#121212] mt-2">📖 {stats.studiedToday} بطاقة</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-white border border-[#EFE6DD]">
                    <div className="text-xs font-bold text-gray-500">نسبة الدقة</div>
                    <div className="text-2xl font-black text-[#121212] mt-2">🎯 {stats.accuracy}%</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-white border border-[#EFE6DD]">
                    <div className="text-xs font-bold text-gray-500">بطاقات إتقان تام</div>
                    <div className="text-2xl font-black text-[#121212] mt-2">✅ {stats.totalMastered}</div>
                  </div>
                </div>

                {/* Decks Preview */}
                <div>
                  <h2 className="text-lg font-bold mb-4">المجموعات الأخيرة</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {decks.map(deck => (
                      <div key={deck.id} className="bg-white p-5 rounded-2xl border border-[#EFE6DD] flex flex-col justify-between h-48 shadow-sm">
                        <div>
                          <h3 className="font-bold text-[#800020] text-lg">{deck.title}</h3>
                          <p className="text-xs text-gray-500 mt-2 line-clamp-2">{deck.description}</p>
                        </div>
                        <div className="flex justify-between items-center pt-4 border-t border-[#FAF6F0]">
                          <span className="text-xs font-bold text-gray-500 bg-[#FAF6F0] px-2.5 py-1 rounded-md">
                            {deck.cards.length} بطاقات
                          </span>
                          <button
                            onClick={() => startStudySession(deck)}
                            className="px-4 py-1.5 bg-[#800020] text-white text-xs font-bold rounded-lg shadow hover:bg-[#5A0016]"
                          >
                            دراسة
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* DECKS TAB */}
            {activeTab === 'decks' && !selectedDeck && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-black">مجموعات البطاقات</h1>
                    <p className="text-sm text-gray-600">إدارة وإنشاء بطاقات المراجعة الخاصة بك.</p>
                  </div>
                  <button
                    onClick={() => setShowDeckModal(true)}
                    className="px-4 py-2 bg-[#800020] text-white font-bold rounded-xl text-sm shadow hover:bg-[#5A0016]"
                  >
                    + إنشاء مجموعة جديدة
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {decks.map(deck => (
                    <div key={deck.id} className="bg-white p-5 rounded-2xl border border-[#EFE6DD] flex flex-col justify-between h-52 shadow-sm">
                      <div>
                        <div className="flex justify-between items-start">
                          <h3 className="font-bold text-[#800020] text-lg">{deck.title}</h3>
                          <button 
                            onClick={() => handleDeleteDeck(deck.id)}
                            className="text-xs text-red-500 hover:text-red-700 font-bold p-1"
                          >
                            حذف
                          </button>
                        </div>
                        <p className="text-xs text-gray-500 mt-2 line-clamp-2">{deck.description}</p>
                      </div>
                      <div className="flex justify-between items-center pt-4 border-t border-[#FAF6F0]">
                        <span className="text-xs font-bold text-gray-500 bg-[#FAF6F0] px-2.5 py-1 rounded-md">
                          {deck.cards.length} بطاقات
                        </span>
                        <div className="flex gap-2">
                          <button
                            onClick={() => setSelectedDeck(deck)}
                            className="px-3 py-1.5 bg-[#EFE6DD] text-[#121212] text-xs font-bold rounded-lg"
                          >
                            إدارة
                          </button>
                          <button
                            onClick={() => startStudySession(deck)}
                            className="px-3 py-1.5 bg-[#800020] text-white text-xs font-bold rounded-lg shadow hover:bg-[#5A0016]"
                          >
                            دراسة
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SINGLE DECK VIEW */}
            {activeTab === 'decks' && selectedDeck && (
              <div className="space-y-6">
                <button
                  onClick={() => setSelectedDeck(null)}
                  className="text-sm font-bold text-gray-500 hover:text-[#800020]"
                >
                  ← العودة للمجموعات
                </button>

                <div className="bg-white p-6 rounded-2xl border border-[#EFE6DD] shadow-sm flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-black text-[#800020]">{selectedDeck.title}</h1>
                    <p className="text-sm text-gray-600 mt-1">{selectedDeck.description}</p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setShowCardModal(true)}
                      className="px-4 py-2 bg-[#FAF6F0] text-[#121212] border border-[#EFE6DD] font-bold text-xs rounded-xl"
                    >
                      + إضافة بطاقة
                    </button>
                    <button
                      onClick={() => startStudySession(selectedDeck)}
                      className="px-4 py-2 bg-[#800020] text-white font-bold text-xs rounded-xl shadow"
                    >
                      ▶ ابدأ الدراسة
                    </button>
                  </div>
                </div>

                {/* Cards */}
                <div className="space-y-3">
                  <h2 className="font-bold text-base">بطاقات المجموعة</h2>
                  {selectedDeck.cards.length === 0 ? (
                    <div className="p-8 text-center bg-white rounded-2xl border border-dashed text-gray-400">
                      لا توجد بطاقات في هذه المجموعة بعد. اضغط على "+ إضافة بطاقة".
                    </div>
                  ) : (
                    selectedDeck.cards.map((card, idx) => (
                      <div key={card.id} className="bg-white p-4 rounded-xl border border-[#EFE6DD] flex justify-between items-center">
                        <div>
                          <span className="text-xs font-bold text-[#800020]">بطاقة #{idx + 1}</span>
                          <p className="font-bold text-sm text-[#121212] mt-1">{card.front}</p>
                          <p className="text-xs text-gray-500 mt-1 whitespace-pre-line">{card.back}</p>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* STUDY MODE */}
            {activeTab === 'study' && selectedDeck && (
              <div className="max-w-xl mx-auto space-y-6">
                <div className="flex justify-between items-center">
                  <button
                    onClick={() => setActiveTab('decks')}
                    className="text-xs font-bold text-gray-500 hover:text-[#800020]"
                  >
                    ✕ إنهاء الجلسة
                  </button>
                  <span className="text-xs font-bold text-[#800020] bg-white px-3 py-1 rounded-full border">
                    {selectedDeck.title}
                  </span>
                  <span className="text-xs font-bold text-gray-600">
                    {currentCardIdx + 1} / {selectedDeck.cards.length}
                  </span>
                </div>

                {!sessionCompleted ? (
                  <div className="space-y-6">
                    {/* 3D Flip Card */}
                    <div 
                      onClick={() => setIsFlipped(!isFlipped)} 
                      className="perspective-1000 w-full h-80 cursor-pointer select-none"
                    >
                      <div className={`relative w-full h-full rounded-2xl transition-transform duration-500 transform-style-3d shadow-md border border-[#EFE6DD] ${isFlipped ? 'rotate-y-180' : ''}`}>
                        
                        {/* Front */}
                        <div className="absolute inset-0 bg-white rounded-2xl p-8 flex flex-col justify-between items-center text-center backface-hidden">
                          <span className="text-xs font-extrabold text-[#800020]">السؤال / المفهوم</span>
                          <p className="text-xl font-bold">{selectedDeck.cards[currentCardIdx]?.front}</p>
                          <span className="text-xs text-gray-400">اضغط على البطاقة لقلبها 🔄</span>
                        </div>

                        {/* Back */}
                        <div className="absolute inset-0 bg-[#800020] text-white rounded-2xl p-8 flex flex-col justify-between items-center text-center rotate-y-180 backface-hidden">
                          <span className="text-xs font-extrabold text-amber-200">الإجابة / الشرح</span>
                          <p className="text-base font-medium whitespace-pre-line">{selectedDeck.cards[currentCardIdx]?.back}</p>
                          <span className="text-xs text-red-200">قيم مستوى صعوبة البطاقة بالأسفل 👇</span>
                        </div>

                      </div>
                    </div>

                    {/* Controls */}
                    {isFlipped ? (
                      <div className="grid grid-cols-3 gap-3">
                        <button
                          onClick={() => handleRateCard('hard')}
                          className="py-3 bg-red-100 text-red-800 font-bold rounded-xl text-sm border border-red-200"
                        >
                          🔴 صعب
                        </button>
                        <button
                          onClick={() => handleRateCard('medium')}
                          className="py-3 bg-amber-100 text-amber-800 font-bold rounded-xl text-sm border border-amber-200"
                        >
                          🟠 متوسط
                        </button>
                        <button
                          onClick={() => handleRateCard('easy')}
                          className="py-3 bg-emerald-100 text-emerald-800 font-bold rounded-xl text-sm border border-emerald-200"
                        >
                          🟢 سهل جداً
                        </button>
                      </div>
                    ) : (
                      <p className="text-center text-xs text-gray-500">انقر على البطاقة لإظهار الإجابة وتقييم المستوى.</p>
                    )}
                  </div>
                ) : (
                  <div className="bg-white p-8 rounded-2xl border text-center space-y-4">
                    <div className="text-4xl">🎉</div>
                    <h2 className="text-2xl font-black text-[#800020]">أحسنت! أكملت المجموعة</h2>
                    <p className="text-sm text-gray-600">تم حفظ تقدمك وإحصائياتك بنجاح.</p>
                    <button
                      onClick={() => setActiveTab('dashboard')}
                      className="mt-4 px-6 py-2.5 bg-[#800020] text-white font-bold rounded-xl shadow"
                    >
                      العودة للوحة التحكم
                    </button>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Modal - Create Deck */}
          {showDeckModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-xl">
                <h3 className="text-lg font-bold text-[#800020]">إنشاء مجموعة جديدة</h3>
                <form onSubmit={handleCreateDeck} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold mb-1">اسم المجموعة</label>
                    <input
                      type="text"
                      required
                      placeholder="مثال: مادة الجراحة"
                      value={deckTitle}
                      onChange={e => setDeckTitle(e.target.value)}
                      className="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-[#800020]"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">الوصف</label>
                    <textarea
                      placeholder="وصف مختصر للمحتوى..."
                      value={deckDesc}
                      onChange={e => setDeckDesc(e.target.value)}
                      className="w-full px-3 py-2 border rounded-xl text-sm h-20 focus:outline-none focus:border-[#800020]"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowDeckModal(false)}
                      className="px-4 py-2 text-xs font-bold text-gray-500"
                    >
                      إلغاء
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-[#800020] text-white text-xs font-bold rounded-lg"
                    >
                      حفظ المجموعة
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal - Add Card */}
          {showCardModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-xl">
                <h3 className="text-lg font-bold text-[#800020]">إضافة بطاقة جديدة</h3>
                <form onSubmit={handleAddCard} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold mb-1">الوجه الأمامي (السؤال / المصطلح)</label>
                    <textarea
                      required
                      placeholder="اكتب السؤال هنا..."
                      value={cardFront}
                      onChange={e => setCardFront(e.target.value)}
                      className="w-full px-3 py-2 border rounded-xl text-sm h-20 focus:outline-none focus:border-[#800020]"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">الوجه الخلفي (الإجابة / الشرح)</label>
                    <textarea
                      required
                      placeholder="اكتب الإجابة والتفاصيل هنا..."
                      value={cardBack}
                      onChange={e => setCardBack(e.target.value)}
                      className="w-full px-3 py-2 border rounded-xl text-sm h-24 focus:outline-none focus:border-[#800020]"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowCardModal(false)}
                      className="px-4 py-2 text-xs font-bold text-gray-500"
                    >
                      إلغاء
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-[#800020] text-white text-xs font-bold rounded-lg"
                    >
                      إضافة البطاقة
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
